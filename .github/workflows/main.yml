on: push
name: 🚀 Deploy website on push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Upload via SFTP (ultra simple)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ssh-quaiantiquerestaurantfg.alwaysdata.net
        username: quaiantiquerestaurantfg
        password: ${{ secrets.ftp_password }}
        port: 22
        script: |
          sftp -o StrictHostKeyChecking=no -P 22 quaiantiquerestaurantfg@ssh-quaiantiquerestaurantfg.alwaysdata.net <<EOF
          put -r * /home/quaiantiquerestaurantfg/www
          EOF
