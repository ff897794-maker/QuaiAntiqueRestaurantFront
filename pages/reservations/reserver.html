<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Ma réservation</h1>
  </div>
</div>
<div class="container">
  <form>
    <div class="mb-3">
      <label for="NomInput" class="form-label">Nom</label>
      <input
        disabled
        type="text"
        class="form-control"
        id="NomInput"
        placeholder="Votre nom"
        name="Nom"
        value="John"
      />
    </div>
    <div class="mb-3">
      <label for="PrenomInput" class="form-label">Prénom</label>
      <input
        disabled
        type="text"
        class="form-control"
        id="PrenomInput"
        placeholder="Votre prénom"
        name="Prenom"
        value="Doe"
      />
    </div>
    <div class="mb-3">
      <label for="allergieInput" class="form-label">Allergies</label>
      <input
        type="text"
        class="form-control"
        id="allergieInput"
        placeholder="Vos allergies (fruits de mer,arachides, gluten, etc.)"
        name="Allergies"
        value="Arachides"
      />
    </div>
    <div class="mb-3">
      <label for="nbConvivesInput" class="form-label"
        >Nombre de convives habituel</label
      >
      <input
        type="number"
        class="form-control"
        id="nbConvivesInput"
        placeholder="Combien de convives viennent habituellement avec vous ?"
        name="NbConvives"
        value="2"
      />
    </div>
    <div class="mb-3">
      <label for="DateInput" class="form-label">Date de la réservation</label>
      <input
        type="date"
        class="form-control"
        id="DateInput"
        placeholder="Sélectionnez la date de votre réservation"
        name="Date"
        value="2023-05-12"
      />
    </div>
    <div class="mb-3">
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="serviceChoisit"
          id="midiRadio"
        />
        <label class="form-check-label" for="midiRadio"> Midi </label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="serviceChoisit"
          id="soirRadio"
          checked
        />
        <label class="form-check-label" for="soirRadio"> Soir </label>
      </div>
      <div class="mb-3">
        <select name="form-select" id="selectHour" class="form-select">
          <option>19:30</option>
          <option>19:45</option>
          <option>20:00</option>
          <option>20:15</option>
          <option>20:30</option>
          <option>20:45</option>
          <option>21:00</option>
          <option>21:15</option>
          <option>21:30</option>
          <option>21:45</option>
          <option>22:00</option>
          <option>22:15</option>
        </select>
      </div>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary">Réserver</button>
      <button
        type="button"
        class="btn btn-danger"
        id="deleteAccountButton"
        data-bs-toggle="modal"
        data-bs-target="#cancelModal"
      >
        Annuler
      </button>
    </div>
  </form>
</div>
<!-- Modal d'annulation -->
<div
  class="modal fade"
  id="cancelModal"
  tabindex="-1"
  aria-labelledby="cancelModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cancelModalLabel">
          Êtes-vous sûr de vouloir annuler cette réservation ?
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <a href="#">
          <span>12/05/2023</span> | <span>Soir</span> |<span>19:30</span> |
          <span>2 </span>Personne(s) | Allergie(s): <span>Arachides</span>
        </a>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Annuler
        </button>
        <button type="button" class="btn btn-danger">Confirmer</button>
      </div>
    </div>
  </div>
</div>
