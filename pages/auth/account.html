<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Mon compte</h1>
  </div>
</div>
<div class="container">
  <form>
    <div class="mb-3">
      <label for="NomInput" class="form-label">Nom</label>
      <input
        type="text"
        class="form-control"
        id="NomInput"
        placeholder="Votre nom"
        name="Nom"
        value="John"
      />
    </div>
    <div class="mb-3">
      <label for="PrenomInput" class="form-label">Prénom</label>
      <input
        type="text"
        class="form-control"
        id="PrenomInput"
        placeholder="Votre prénom"
        name="Prenom"
        value="Doe"
      />
    </div>
    <div class="mb-3">
      <label for="allergieInput" class="form-label">Allergies</label>
      <input
        type="text"
        class="form-control"
        id="allergieInput"
        placeholder="Vos allergies (fruits de mer,arachides, gluten, etc.)"
        name="Allergies"
        value="Arachides"
      />
    </div>
    <div class="mb-3">
      <label for="nbConvivesInput" class="form-label"
        >Nombre de convives habituel</label
      >
      <input
        type="number"
        class="form-control"
        id="nbConvivesInput"
        placeholder="Combien de convives viennent habituellement avec vous ?"
        name="NbConvives"
        value="2"
      />
    </div>
    <div class="text-center">
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#confirmModal"
      >
        Modifier vos informations
      </button>
      <button
        type="button"
        class="btn btn-danger"
        id="deleteAccountButton"
        data-bs-toggle="modal"
        data-bs-target="#deleteAccountModal"
      >
        Supprimer votre compte
      </button>
    </div>
  </form>
  <div class="text-center pt-3">
    <a href="/editPassword">Cliquez ici pour modifier votre mot de passe</a>
  </div>
</div>

<!-- Modal de confirmation d'enregistrement des modifications -->

<div
  class="modal fade"
  id="confirmModal"
  tabindex="-1"
  aria-labelledby="confirmModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Confirmation</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p>Vos informations ont été mises à jour avec succès.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Fermer
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MModal de suppression de compte -->
<div
  class="modal fade"
  id="deleteAccountModal"
  tabindex="-1"
  aria-labelledby="deleteAccountModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteAccountModalLabel">
          Suppression de votre compte
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p>
          Êtes-vous sûr de vouloir supprimer votre compte ? Cette action est
          irréversible.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Annuler
        </button>
        <button type="button" class="btn btn-danger">Confirmer</button>
      </div>
    </div>
  </div>
</div>
